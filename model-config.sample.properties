# ══════════════════════════════════════════════════════════════════════════════
#  AlphaQuant — AI Model Configuration File  (SAMPLE)
#
#  HOW TO USE:
#    1. Copy this file and rename it (e.g. my-config.properties)
#    2. Uncomment the provider block you want to use
#    3. Fill in your values
#    4. Upload via: Settings (⚙) → Upload Config File
#
#  SUPPORTED PROVIDERS: ollama | openai | anthropic | google
#
#  WHERE TO GET KEYS:
#    Google AI Studio : https://aistudio.google.com/app/apikeys
#    OpenAI           : https://platform.openai.com/api-keys
#    Anthropic        : https://console.anthropic.com/settings/keys
#    Ollama           : no key needed — install from https://ollama.com
# ══════════════════════════════════════════════════════════════════════════════


# ── Google Gemini (free tier available) ──────────────────────────────────────
provider=google
model=gemini-2.0-flash
apiKey=YOUR_GOOGLE_AI_STUDIO_API_KEY
baseUrl=https://generativelanguage.googleapis.com/v1beta/openai
temperature=0.0


