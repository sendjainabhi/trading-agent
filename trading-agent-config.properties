# ══════════════════════════════════════════════════════════════════════════════
#  Trading Agent — Model Configuration File
#  Upload via: Settings (⚙) → Upload Config File
#
#  HOW TO USE:
#    1. Choose your provider and uncomment the matching block below
#    2. Fill in your values
#    3. Save and upload from the Settings modal
#
#  SUPPORTED PROVIDERS: ollama | openai | anthropic
# ══════════════════════════════════════════════════════════════════════════════


# ── ACTIVE PROVIDER ───────────────────────────────────────────────────────────
#  Choose one: ollama | openai | anthropic
provider=openai


# ── MODEL NAME ────────────────────────────────────────────────────────────────
#  Must match exactly what the provider API expects.
#
#  Ollama models    : qwen3.6:35b | llama3:8b | mistral | gemma3:27b
#  OpenAI models    : gpt-4o | gpt-4o-mini | gpt-4-turbo | gpt-3.5-turbo
#  Anthropic models : claude-sonnet-4-6 | claude-opus-4-8 | claude-haiku-4-5-20251001
#  Custom proxy     : use the model name your proxy endpoint expects
#
model=gpt-4o


# ── API KEY ───────────────────────────────────────────────────────────────────
#  Required for OpenAI and Anthropic. Leave blank for Ollama (no key needed).
#
#  OpenAI key format   : sk-...
#  Anthropic key format: sk-ant-...
#  Custom proxy        : use the token or key your proxy requires
#
apiKey=sk-your-api-key-here


# ── ENDPOINT / BASE URL ───────────────────────────────────────────────────────
#  The host URL up to (but NOT including) /v1.
#  The app appends /v1/chat/completions automatically.
#
#  Ollama local         : http://127.0.0.1:11434
#  OpenAI official      : https://api.openai.com
#  Anthropic official   : https://api.anthropic.com
#  Custom proxy / LLM   : http://your-server-ip:port/optional-path-prefix
#
baseUrl=https://api.openai.com


# ── TEMPERATURE ───────────────────────────────────────────────────────────────
#  Controls response randomness. Range: 0.0 (deterministic) to 1.0 (creative).
#  Recommended for trading analysis: 0.0 (strict, no hallucination)
#
temperature=0.0


# ══════════════════════════════════════════════════════════════════════════════
#  QUICK-SWITCH TEMPLATES — copy values from the block you want to activate
# ══════════════════════════════════════════════════════════════════════════════

# ── Ollama (local) ────────────────────────────────────────────────────────────
# provider=ollama
# model=qwen3.6:35b
# apiKey=
# baseUrl=http://127.0.0.1:11434
# temperature=0.0

# ── OpenAI ────────────────────────────────────────────────────────────────────
# provider=openai
# model=gpt-4o
# apiKey=sk-...
# baseUrl=https://api.openai.com
# temperature=0.0

# ── Anthropic ─────────────────────────────────────────────────────────────────
# provider=anthropic
# model=claude-sonnet-4-6
# apiKey=sk-ant-...
# baseUrl=https://api.anthropic.com
# temperature=0.0

# ── Custom / Self-hosted OpenAI-compatible proxy ──────────────────────────────
# provider=openai
# model=your-model-name
# apiKey=your-token-here
# baseUrl=http://your-proxy-host/optional-path-prefix
# temperature=0.0
