# ── OpenAI ────────────────────────────────────────────────────────────────────
# provider=openai
# model=gpt-4o
# apiKey=sk-...
# baseUrl=https://api.openai.com
# temperature=0.0

# ── Anthropic ─────────────────────────────────────────────────────────────────
# provider=anthropic
# model=claude-sonnet-4-6
# apiKey=sk-ant-...
# baseUrl=https://api.anthropic.com
# temperature=0.0

# ── Custom / Self-hosted OpenAI-compatible proxy ──────────────────────────────
# provider=openai
# model=your-model-name
# apiKey=any-non-empty-string
# baseUrl=http://192.168.1.x:port/proxy-path
# temperature=0.0
