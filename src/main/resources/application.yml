server:
  port: ${SERVER_PORT:9090}   # start.sh passes 9090, local-start.sh passes 9091

spring:
  application:
    name: trading-agent
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
      - org.springframework.ai.autoconfigure.anthropic.AnthropicAutoConfiguration
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen3.6:35b}
          temperature: 0.0
    # ── OpenAI (optional) ── set OPENAI_API_KEY env var or fill below ──────────
    openai:
      api-key: "${OPENAI_API_KEY:}"
      base-url: "${OPENAI_BASE_URL:https://api.openai.com}"   # override for Azure / proxy
      chat:
        options:
          model: gpt-4o
          temperature: 0.0
    # ── Anthropic (optional) ── set ANTHROPIC_API_KEY env var or fill below ───
    anthropic:
      api-key: "${ANTHROPIC_API_KEY:}"
      base-url: "${ANTHROPIC_BASE_URL:https://api.anthropic.com}"  # override for proxy
      chat:
        options:
          model: claude-sonnet-4-6
          temperature: 0.0


